<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Cold-press paper: fine fibres over a coarser tooth, tiled over the page. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2" stitchTiles="stitch" result="fibre"/>
    <feColorMatrix in="fibre" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.12  0.14 0 0 0 0" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="6" stitchTiles="stitch" result="tooth"/>
    <feColorMatrix in="tooth" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.15  0.16 0 0 0 -0.06" result="coarse"/>
    <feMerge><feMergeNode in="coarse"/><feMergeNode in="fine"/></feMerge>
  </filter>
  <rect width="240" height="240" filter="url(#g)"/>
</svg>
